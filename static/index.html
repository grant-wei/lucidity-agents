<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucidity</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1db;
  --accent:#3a5bd9;--needs:#c2410c;--needs-bg:#fff4ec;--work:#2563eb;--done:#15803d;--warn:#a16207;--warn-bg:#fdf6e3;
  --bad:#b91c1c;--bad-bg:#fdecec;--code:#efeee9;--chip:#f0efea;--on-accent:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#9c9b95;--line:#33322f;
  --accent:#8ea4ff;--needs:#fb923c;--needs-bg:#2a1d14;--work:#7aa7ff;--done:#4ade80;--warn:#facc15;--warn-bg:#2a2614;
  --bad:#f87171;--bad-bg:#2b1717;--code:#262624;--chip:#2a2a27;--on-accent:#141413;}}
:root[data-theme="dark"]{
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#9c9b95;--line:#33322f;
  --accent:#8ea4ff;--needs:#fb923c;--needs-bg:#2a1d14;--work:#7aa7ff;--done:#4ade80;--warn:#facc15;--warn-bg:#2a2614;
  --bad:#f87171;--bad-bg:#2b1717;--code:#262624;--chip:#2a2a27;--on-accent:#141413;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:18px;margin:0;letter-spacing:.2px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:disabled{opacity:.6;cursor:default}
nav{display:flex;gap:4px}
nav button{border:none;background:none;color:var(--muted);padding:6px 10px;border-radius:6px}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.meter{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.meter b{color:var(--ink);font-weight:600}
.meter .track{width:40px;height:4px}
.track{display:inline-block;width:70px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;overflow:hidden}
.track i{display:block;height:100%;background:var(--done)}
.banner{border-radius:8px;padding:10px 12px;margin-bottom:12px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--line)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.needs{background:var(--needs-bg);border:1px solid var(--line);border-left:4px solid var(--needs);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.needs h2{margin:0 0 6px;font-size:14px;color:var(--needs)}
.needs ul{margin:0;padding-left:18px}
.needs li{margin:3px 0}
.needs a{color:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card.flagged{border-color:var(--bad)}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.proj{font-weight:650;font-size:15px;overflow-wrap:anywhere}
.state{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.s-needs_you{color:var(--needs)}.s-working{color:var(--work)}.s-finished{color:var(--done)}.s-unknown{color:var(--muted)}
.sub{color:var(--muted);font-size:12px;margin:2px 0 8px;overflow-wrap:anywhere}
.task{font-size:13px;color:var(--muted);margin-bottom:8px;overflow-wrap:anywhere}
.claim{margin:4px 0;overflow-wrap:anywhere}
.claim .f{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-right:4px}
.eid{font:11px ui-monospace,Consolas,monospace;background:var(--chip);border:none;padding:0 5px;border-radius:4px;margin-left:3px;color:var(--accent)}
.box{border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;overflow-wrap:anywhere}
.box.bad{background:var(--bad-bg)}.box.warn{background:var(--warn-bg)}.box.ok{background:var(--chip)}
.box b{display:block;margin-bottom:2px}
.box .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.cond{margin:2px 0}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:12px}
.ev{font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--code);border-radius:6px;padding:6px 8px;margin-top:6px;max-height:280px;overflow:auto}
.ev div{white-space:pre-wrap;overflow-wrap:anywhere;padding:2px 0;border-bottom:1px dashed var(--line)}
.ev div.hl{background:var(--warn-bg)}
.ev .err{color:var(--bad)}
.note{font-size:11px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:40px 16px;max-width:560px;margin:0 auto}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.intro{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:760px}
.intro b{color:var(--ink)}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:4px 0 8px}
.needs .why{font-size:12px;color:var(--muted);margin:-2px 0 6px}
.box .what{font-size:11.5px;color:var(--muted);margin-bottom:4px}
@media (max-width:640px){.meter{order:5}.bar{gap:8px 12px}nav{order:6;flex-basis:100%;overflow-x:auto}}
/* flow */
.flowwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:12px}
@media (max-width:820px){.flowwrap{grid-template-columns:1fr}}
.svgbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
svg{width:100%;height:auto;display:block}
.node rect{stroke-width:1.5;cursor:pointer}
.node.code rect{fill:var(--chip);stroke:var(--line)}
.node.agent rect{fill:var(--panel);stroke:var(--accent)}
.node.sel rect{stroke-width:3}
.node text{fill:var(--ink);font-size:12px;pointer-events:none}
.node text.s{fill:var(--muted);font-size:10.5px}
.edge{stroke:var(--muted);stroke-width:1.3;fill:none}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.detail h3{margin:0 0 4px;font-size:15px}
.detail pre{font:11.5px/1.4 ui-monospace,Consolas,monospace;background:var(--code);padding:8px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select{font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{color:var(--muted);font-weight:600;font-size:12px;overflow-wrap:normal}
td.num{white-space:nowrap;overflow-wrap:normal}
@media (max-width:640px){
  table.stack thead{display:none}
  table.stack tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:4px}
  table.stack td{display:flex;justify-content:space-between;gap:10px;border:none;padding:3px 6px}
  table.stack td::before{content:attr(data-h);color:var(--muted);font-size:12px}
  table.stack td[data-h="Configuration"]{display:block;min-width:0!important}
  table.stack td[data-h="Configuration"]::before{display:none}
}
/* map */
.toolbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin:2px 0 14px}
.repo-pick{field-sizing:content;font:inherit;font-size:18px;font-weight:650;border:1px solid transparent;background:none;padding:2px 6px;margin-left:-6px;border-radius:6px;max-width:100%;cursor:pointer}
.repo-pick:hover,.repo-pick:focus{border-color:var(--line);background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:none;border-radius:0;padding:4px 11px;color:var(--muted);background:none;font-size:13px}
.seg button.on{background:var(--chip);color:var(--ink);font-weight:600}
.stats{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.mapwrap{grid-template-columns:1fr}.stats{margin-left:0}}
.canvas{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}
.side h3{margin:0 0 2px;font-size:16px;overflow-wrap:anywhere}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 6px;font-weight:600}
.srow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 9px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:7px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:7px;font-size:13px}
.srow:hover,.srow.on{background:var(--chip)}
.srow .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .c{color:var(--muted);font-size:12px}
.srow .m{grid-column:2/4;font-size:11.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.mod rect.b{fill:var(--bg);stroke:var(--line);stroke-width:1;cursor:pointer}
.mod.hot rect.b{fill:var(--panel)}
.mod rect.h{fill:var(--accent);pointer-events:none}
.mod:hover rect.b{stroke:var(--muted)}
.mod.sel rect.b{stroke:var(--ink);stroke-width:2}
.mod.dim{opacity:.25}
.mod.gone rect.b{stroke-dasharray:4 3}
.mod text{pointer-events:none}
.mod text.t{fill:var(--ink);font-size:14px;font-weight:600}
.mod text.r{fill:var(--muted);font-size:11.5px}
.mod.cold text.t{fill:var(--muted);font-weight:500}
.dep{stroke:var(--muted);stroke-width:1;fill:none;opacity:.16}
.dep.hot{stroke:var(--accent);opacity:.9;stroke-width:1.6}
.key{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:12px}
.key i{display:inline-block;vertical-align:middle;margin-right:6px}
.swatch{width:26px;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--bg),var(--accent));border:1px solid var(--line)}
.back{border:none;background:none;color:var(--accent);padding:0;font-size:13px;margin-bottom:10px}
.meta{font-size:12.5px;color:var(--muted)}
.role{font-size:14px;margin:10px 0 4px}
.cite{font-size:11.5px;color:var(--muted)}
.file{font:12px ui-monospace,Consolas,monospace;overflow-wrap:anywhere;display:block;padding:1px 0}
.touch{padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.touch:first-of-type{border-top:none}
.plus{color:var(--done)}.minus{color:var(--bad)}
.bar2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px;padding:4px 0}
.bar2 .track{width:100%;grid-column:1/3;height:4px}
.bar2 .track i{background:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Lucidity</h1>
    <span class="pill" id="mode">…</span>
    <nav>
      <button data-tab="map" class="on">Map</button>
      <button data-tab="sessions">Sessions</button>
      <button data-tab="flow">Trace</button>
      <button data-tab="replay">Planner</button>
      <button data-tab="evals">Evals</button>
    </nav>
    <span class="spacer"></span>
    <div class="meter" id="meter"></div>
    <button id="refresh" title="Read the session logs again now">Refresh</button>
  </div>
</header>
<main>
  <div id="banners"></div>
  <section id="tab-map"></section>
  <section id="tab-sessions" hidden></section>
  <section id="tab-flow" hidden></section>
  <section id="tab-replay" hidden></section>
  <section id="tab-evals" hidden></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n == null ? "–" : (n < 0.01 && n > 0 ? "$" + n.toFixed(4) : "$" + n.toFixed(2));
const mins = m => m == null ? "–" : m < 1 ? "just now" : m < 60 ? Math.round(m) + " min ago" : (m / 60).toFixed(1) + " h ago";
const LABEL = {needs_you: "needs you", working: "working", finished: "finished", unknown: "unknown"};
const FIELD = {doing_now: "now", done_so_far: "done", needs_from_you: "needs"};
let snap = null, tab = "map", traceSel = null, traceData = null, nodeSel = null;

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  for (const t of ["map", "sessions", "flow", "replay", "evals"]) $("#tab-" + t).hidden = t !== tab;
  if (tab === "map") loadMap();
  if (tab === "replay") loadReplay();
  if (tab === "flow") loadTraces();
  if (tab === "evals") loadEvals();
});
$("#refresh").onclick = async () => {
  $("#refresh").disabled = true; $("#refresh").textContent = "Refreshing…";
  await fetch("/api/refresh", {method: "POST"});
  setTimeout(poll, 1500);
  if (tab === "map") setTimeout(loadMap, 4000);
};

async function poll() {
  try {
    snap = await (await fetch("/api/snapshot")).json();
    render();
  } catch (e) { $("#banners").innerHTML = `<div class="banner bad">Can't reach the Lucidity server.</div>`; }
  const busy = snap && snap.refreshing;
  $("#refresh").disabled = !!busy; $("#refresh").textContent = busy ? "Refreshing…" : "Refresh";
  setTimeout(poll, busy ? 1500 : 10000);
}

function render() {
  $("#mode").textContent = snap.mode === "local" ? "your sessions" : "sample data";
  $("#mode").title = "Model: " + (snap.model || "none");
  const sc = snap.self_cost || {}, caps = snap.caps || {};
  const pct = Math.min(100, 100 * (sc.usd_today || 0) / (caps.daily_usd || 1));
  $("#meter").title = `What Lucidity itself spent on model calls today, against its cap.
Model requests in the last hour: ${sc.calls_last_hour ?? 0} of ${caps.calls_per_hour ?? "–"}.` +
    (snap.changed != null ? `
Last refresh: ${snap.changed} sessions changed, ${snap.skipped} skipped.` : "");
  $("#meter").innerHTML = `<b>${money(sc.usd_today || 0)}</b> of ${money(caps.daily_usd)} today <span class="track"><i style="width:${pct}%;background:${pct > 80 ? "var(--bad)" : "var(--done)"}"></i></span>`;
  let b = "";
  if (snap.error) b += `<div class="banner bad">${esc(snap.error)}</div>`;
  if (snap.banner) b += `<div class="banner">${esc(snap.banner)}</div>`;
  $("#banners").innerHTML = b;
  if (tab === "sessions") renderSessions();
}

function renderSessions() {
  const rows = snap.sessions || [];
  if (!rows.length) {
    $("#tab-sessions").innerHTML = snap.refreshing || !snap.refresh_id
      ? `<div class="empty"><b>Reading your sessions…</b>The first refresh takes 20 to 40 seconds. After that, only sessions that changed are read again.</div>`
      : snap.mode === "local"
      ? `<div class="empty"><b>No agent sessions from the last 3 days.</b>Lucidity looks in <code>~/.claude/projects</code> and <code>~/.codex/sessions</code>. Start a Claude Code or Codex session and press Refresh, or restart without <code>LUCIDITY_DATA=local</code> to see the sample data.</div>`
      : `<div class="empty"><b>No sample sessions found.</b>The <code>sample_data/sessions</code> folder is empty. Rebuild it with <code>python sample_data/generate.py</code>.</div>`;
    return;
  }
  const needs = rows.filter(r => r.state === "needs_you");
  const flagged = rows.filter(r => r.flags.length || (r.checker && r.checker.verdict === "not_verified") || r.secrets.length);
  let h = `<p class="intro"><b>Every coding agent you have running, on one screen.</b> Lucidity reads ${snap.mode === "local" ? "your Claude Code and Codex logs" : "8 sample agent sessions"}, works out which ones are waiting on you, and checks the ones that say they're done. Every claim cites the log line it came from: click a chip like <span class="eid" style="cursor:default">e12</span> to see it.</p>`;
  if (needs.length || flagged.length) {
    h += `<div class="needs"><h2>Needs you (${needs.length + flagged.filter(r => r.state !== "needs_you").length})</h2>
      <div class="why">Agents blocked on an answer or approval, plus anything a rule flagged: runaway spend, a repeating failure, a "done" that didn't check out, a leaked secret.</div><ul>`;
    for (const r of needs) {
      const c = r.claims.find(c => c.field === "needs_from_you") || r.claims[0];
      h += `<li><a href="#c-${esc(r.id)}"><b>${esc(r.project)}</b></a>: ${esc(c ? c.text : "waiting on you")}</li>`;
    }
    for (const r of flagged.filter(r => r.state !== "needs_you")) {
      const why = r.flags.length ? r.flags[0].kind + ": " + r.flags[0].reason
        : r.secrets.length ? "secret in transcript (" + r.secrets.map(s => s.kind).join(", ") + ")"
        : "says done, checker could not verify";
      h += `<li><a href="#c-${esc(r.id)}"><b>${esc(r.project)}</b></a>: ${esc(why)}</li>`;
    }
    h += `</ul></div>`;
  }
  else h += `<div class="needs" style="border-left-color:var(--done)"><h2 style="color:var(--done)">Nothing needs you</h2><div class="why" style="margin:0">No agent is waiting on you and no rule fired.</div></div>`;
  h += `<h2 class="sec">All sessions (${rows.length})</h2><div class="grid">` + rows.map(card).join("") + `</div>`;
  $("#tab-sessions").innerHTML = h;
  document.querySelectorAll(".eid").forEach(btn => btn.onclick = () => showEvent(btn.dataset.s, btn.dataset.e));
  document.querySelectorAll("[data-act]").forEach(btn => btn.onclick = () => act(btn.dataset.s, btn.dataset.act, btn));
}

function card(r) {
  const flagged = r.flags.length > 0;
  let h = `<div class="card${flagged ? " flagged" : ""}" id="c-${esc(r.id)}">
    <div class="top"><span class="proj">${esc(r.project)}</span>
      <span class="state s-${esc(r.state)}">${esc(LABEL[r.state] || r.state)}</span></div>
    <div class="sub">${esc(r.tool)} · ${esc(r.model || "")} · ${mins(r.idle_min)} · ${money(r.usd)} so far</div>`;
  if (r.first_prompt) h += `<div class="task">“${esc(r.first_prompt.slice(0, 160))}${r.first_prompt.length > 160 ? "…" : ""}”</div>`;
  for (const c of r.claims) {
    h += `<div class="claim"><span class="f">${FIELD[c.field] || c.field}</span>${esc(c.text)}` +
      c.event_ids.map(e => `<button class="eid" data-s="${esc(r.id)}" data-e="${esc(e)}" title="show the log line this is based on">${esc(e)}</button>`).join("") + `</div>`;
  }
  if (r.overridden) h += `<div class="note">Marked "needs you" by a rule: ${esc(r.overridden.because)} (${r.overridden.model_said === "unknown" ? "no model result" : "the model said " + esc(r.overridden.model_said)}).</div>`;
  for (const f of r.flags) {
    const x = r.explanation || {};
    h += `<div class="box bad"><b>${f.kind === "runaway" ? "Runaway spend" : "Stalled"}</b><div class="what">${f.kind === "runaway" ? "A plain-code rule saw the agent looping or spending past its cap." : "A plain-code rule saw the same failure repeat with no progress."}</div>${esc(f.reason)}.` +
      (x.why ? `<div style="margin-top:4px">${esc(x.why)}</div>` : "") +
      (x.next_step ? `<div style="margin-top:4px"><i>Suggested:</i> ${esc(x.next_step)}</div>` : "") +
      `<div class="acts">` + ["pause", "stop", "let_it_run"].map(a =>
        `<button data-act="${a}" data-s="${esc(r.id)}"${x.recommendation === a ? ' class="primary"' : ""}>${a === "let_it_run" ? "Let it run" : a[0].toUpperCase() + a.slice(1)}</button>`).join("") +
      `</div><div class="note">Lucidity doesn't stop agents itself. Your click is logged; stop it in its terminal.</div></div>`;
  }
  if (r.checker) {
    const ok = r.checker.verdict === "verified";
    h += `<div class="box ${ok ? "ok" : "warn"}"><b>${ok ? "✓ Done, verified" : "✗ Says done, not verified"}</b><div class="what">The done checker ran the task's tests and graded each done-when condition.</div>` +
      (r.checker.conditions || []).map(c => `<div class="cond">${c.met ? "✓" : "✗"} ${esc(c.condition)} <span class="note">${esc(c.evidence)}</span></div>`).join("") +
      ((r.checker.missing || []).length ? `<div class="cond"><i>Missing:</i> ${esc(r.checker.missing.map(m => m.replace(/[.;\s]+$/, "")).join("; "))}</div>` : "") +
      (r.checker.tests_ran || []).map(t => `<div class="note">ran <code>${esc(t.command)}</code> → exit ${esc(t.exit_code ?? (t.refused ? "refused" : "?"))}</div>`).join("") + `</div>`;
  }
  if (r.secrets.length) h += `<div class="box bad"><b>Secret in the transcript</b>${esc(r.secrets.map(s => s.kind + " (" + s.event_ids.join(", ") + ")").join("; "))}. It was redacted before any model saw it. Rotate it.</div>`;
  if (r.warning) h += `<div class="box warn"><b>Heads up</b><div class="what">Something the triage agent noticed that isn't a status.</div>${esc(r.warning)}</div>`;
  h += `<details id="d-${esc(r.id)}"><summary>log (last ${r.events.length} of ${r.event_count} events)</summary><div class="ev">` +
    r.events.map(e => `<div data-e="${esc(e.id)}"><b>${esc(e.id)}</b> ${esc(e.kind)}${e.tool ? " " + esc(e.tool) : ""}: <span class="${e.is_error ? "err" : ""}">${esc(e.text.slice(0, 500))}</span></div>`).join("") +
    `</div></details>`;
  return h + `</div>`;
}

function showEvent(sid, eid) {
  const d = document.getElementById("d-" + sid); if (!d) return;
  d.open = true;
  d.querySelectorAll(".ev div").forEach(x => x.classList.toggle("hl", x.dataset.e === eid));
  const t = d.querySelector(`.ev div[data-e="${CSS.escape(eid)}"]`);
  if (t) t.scrollIntoView({block: "nearest"});
  else d.querySelector(".ev").insertAdjacentHTML("afterbegin", `<div class="hl">${esc(eid)} is older than the last ${d.querySelectorAll(".ev div").length} events shown.</div>`);
}

async function act(sid, action, btn) {
  await fetch("/api/action", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({session_id: sid, action})});
  btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("primary"));
  btn.classList.add("primary"); btn.textContent = "✓ " + btn.textContent.replace(/^✓ /, "");
}

/* ---------- map ---------- */
const PALETTE = ["#3a5bd9", "#c2410c", "#15803d", "#a21caf", "#0e7490", "#b45309", "#be123c", "#4d7c0f", "#7c3aed", "#0369a1"];
const WINDOWS = {"24h": 24, "3 days": 72, "7 days": 168};
let mapData = null, repoSel = null, modSel = null, sessSel = null, win = "7 days";
const short = (s, n) => (s = String(s || "")).length > n ? s.slice(0, n - 1) + "…" : s;
const ago = (t, now) => { const m = (now - Date.parse(t)) / 60000; return m >= 2880 ? Math.round(m / 1440) + " days ago" : mins(m); };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

async function loadMap() {
  try { mapData = await (await fetch("/api/map")).json(); } catch (e) { return; }
  if (tab === "map") drawMap();
}

function mapView() {
  const repo = (mapData.repos || []).find(r => r.name === repoSel) || (mapData.repos || [])[0];
  if (!repo) return null;
  repoSel = repo.name;
  const now = Date.parse(mapData.now), cut = now - WINDOWS[win] * 3600e3;
  const touches = repo.touches.filter(t => Date.parse(t.t) >= cut);
  const ids = new Set(touches.map(t => t.session));
  const sessions = repo.sessions.filter(s => ids.has(s.id)).sort((a, b) => Date.parse(b.last_edit) - Date.parse(a.last_edit));
  const color = {}; repo.sessions.forEach((s, i) => color[s.id] = PALETTE[i % PALETTE.length]);
  const byMod = {};
  for (const t of touches) {
    const m = byMod[t.module] = byMod[t.module] || {edits: 0, lines: 0, usd: 0, sessions: new Set()};
    m.edits++; m.lines += t.added + t.removed; m.usd += t.usd; m.sessions.add(t.session);
  }
  if (sessSel && !ids.has(sessSel)) sessSel = null;
  return {repo, now, touches, sessions, color, byMod, roles: (repo.architect || {}).roles || {}};
}

function drawMap() {
  const el = $("#tab-map");
  if (mapData && mapData.error) { el.innerHTML = `<div class="banner bad">${esc(mapData.error)}</div>`; return; }
  if (!mapData || !mapData.repos) {
    el.innerHTML = `<div class="empty"><b>Drawing the map…</b>Reading which files your agents changed and how the code fits together. The first pass over a big repo takes a minute or two.</div>`;
    return;
  }
  const v = mapView();
  if (!v) {
    el.innerHTML = `<div class="empty"><b>No agent edits in the last 7 days.</b>The map is built from the files Claude Code and Codex sessions change. Once an agent edits a file in a git repo, the repo shows up here.</div>`;
    return;
  }
  const {repo, touches, sessions} = v;
  const usd = sessions.reduce((a, s) => a + s.usd, 0);
  el.innerHTML = `<div class="toolbar">
      <select id="repo" class="repo-pick" aria-label="Repository">${mapData.repos.map(r => `<option value="${esc(r.name)}"${r.name === repo.name ? " selected" : ""}>${esc(r.name)}</option>`).join("")}</select>
      <div class="seg" role="group" aria-label="Time window">${Object.keys(WINDOWS).map(w => `<button data-w="${w}"${w === win ? ' class="on"' : ""}>${w}</button>`).join("")}</div>
      <div class="stats"><span><b>${sessions.length}</b> ${sessions.length === 1 ? "session" : "sessions"}</span><span><b>${touches.length}</b> file edits</span><span><b>${money(usd)}</b> agent spend</span></div>
    </div>
    ${mapData.banner ? `<div class="banner">${esc(mapData.banner)}</div>` : ""}
    <div class="mapwrap"><div class="canvas"><div id="msvg"></div>
      <div class="key"><span><i class="swatch"></i>more agent changes</span><span><i class="dot" style="background:var(--muted)"></i>one agent session</span><span>arrows show imports; click a part to see them</span></div></div>
      <aside class="side" id="mdetail"></aside></div>`;
  $("#repo").onchange = e => { repoSel = e.target.value; modSel = sessSel = null; drawMap(); };
  el.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { win = b.dataset.w; drawMap(); });
  drawModules(v);
  drawModDetail(v);
}

function drawModules(v) {
  const {repo, byMod, color, roles} = v;
  const cw = $("#msvg").clientWidth;
  const W = 220, H = 70, GX = 16, GY = 34, PER = cw < 520 ? 2 : cw < 940 ? 3 : 4;
  const rows = {};
  repo.modules.forEach(m => (rows[m.layer] = rows[m.layer] || []).push(m));
  const layersDesc = Object.keys(rows).map(Number).sort((a, b) => b - a);
  layersDesc.forEach(l => rows[l].sort((a, b) => (byMod[b.id] ? 1 : 0) - (byMod[a.id] ? 1 : 0) || a.id.localeCompare(b.id)));
  // top = code that imports the rest, bottom = what it's built on
  let lines = [];
  for (const l of layersDesc) for (let i = 0; i < rows[l].length; i += PER) lines.push(rows[l].slice(i, i + PER));
  if (lines.length > 6) {   // a long import chain would draw one small box per row; share rows, same order
    lines = [[]];
    for (const l of layersDesc) for (const m of rows[l]) {
      if (lines[lines.length - 1].length >= PER) lines.push([]);
      lines[lines.length - 1].push(m);
    }
  }
  const cols = Math.max(...lines.map(r => r.length));
  const width = cols * W + (cols - 1) * GX + 4, height = lines.length * (H + GY) - GY + 4, pos = {};
  lines.forEach((r, ri) => {
    const off = (width - (r.length * W + (r.length - 1) * GX)) / 2;
    r.forEach((m, i) => pos[m.id] = {x: off + i * (W + GX), y: 2 + ri * (H + GY)});
  });
  const maxLines = Math.max(1, ...Object.values(byMod).map(m => m.lines));
  const sessMods = sessSel ? new Set(v.touches.filter(t => t.session === sessSel).map(t => t.module)) : null;
  const near = id => repo.edges.some(e => (e.from === modSel && e.to === id) || (e.to === modSel && e.from === id));
  const lit = id => sessMods ? sessMods.has(id) : modSel ? id === modSel || near(id) : true;
  let s = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Map of ${esc(repo.name)}">
    <defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor" style="color:var(--accent)"/></marker></defs>`;
  for (const e of repo.edges) {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) continue;
    const hot = modSel && (e.from === modSel || e.to === modSel);
    let x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y;
    if (b.y <= a.y) { y1 = a.y + H / 2; y2 = b.y + H / 2; x1 = a.x + (b.x > a.x ? W : 0); x2 = b.x + (b.x > a.x ? 0 : W); }
    const my = (y1 + y2) / 2;
    s += `<path class="dep${hot ? " hot" : ""}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2 - 2}"${hot ? ' marker-end="url(#ma)"' : ""}><title>${esc(e.from)} imports ${esc(e.to)}</title></path>`;
  }
  for (const m of repo.modules) {
    const p = pos[m.id], act = byMod[m.id], role = (roles[m.id] || {}).role || "";
    const heat = act ? 0.07 + 0.38 * Math.sqrt(act.lines / maxLines) : 0;
    const dots = act ? [...act.sessions] : [];
    let r1 = role, r2 = "";
    if (role.length > 32) { const cut = role.lastIndexOf(" ", 32); r1 = role.slice(0, cut > 0 ? cut : 32); r2 = short(role.slice(r1.length).trim(), 33); }
    const nameW = dots.length ? 25 - Math.min(dots.length, 4) * 2 : 27;
    s += `<g class="mod${act ? " hot" : " cold"}${m.id === modSel ? " sel" : ""}${lit(m.id) ? "" : " dim"}${m.gone ? " gone" : ""}" data-m="${esc(m.id)}" tabindex="0">
      <rect class="b" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="9"/>
      ${heat ? `<rect class="h" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="9" opacity="${heat.toFixed(2)}"/>` : ""}
      <text class="t" x="${p.x + 12}" y="${p.y + 23}">${esc(short(m.id, nameW))}</text>
      <text class="r" x="${p.x + 12}" y="${p.y + 42}">${esc(r1)}</text>
      <text class="r" x="${p.x + 12}" y="${p.y + 57}">${esc(r2)}</text>
      ${dots.slice(0, 4).map((d, i) => `<circle cx="${p.x + W - 13 - i * 12}" cy="${p.y + 18}" r="4.5" fill="${color[d]}"/>`).join("")}
      <title>${esc(m.id)}${role ? ": " + esc(role) : ""}</title></g>`;
  }
  $("#msvg").innerHTML = s + `</svg>`;
  document.querySelectorAll(".mod").forEach(g => {
    const pick = () => { modSel = modSel === g.dataset.m ? null : g.dataset.m; sessSel = null; drawMap(); };
    g.onclick = pick; g.onkeydown = e => { if (e.key === "Enter") pick(); };
  });
}

function sessionRow(s, v, extra) {
  return `<button class="srow${s.id === sessSel ? " on" : ""}" data-sess="${esc(s.id)}" title="${esc(s.first_prompt)}">
    <span class="dot" style="background:${v.color[s.id]}"></span><span class="p">${esc(s.first_prompt || "(no prompt)")}</span><span class="c">${money(s.usd)}</span>
    <span class="m">${esc(s.tool)} · ${ago(s.last_edit, v.now)}${extra ? " · " + extra : ""}</span></button>`;
}

function drawModDetail(v) {
  const {repo, touches, roles} = v;
  const back = `<button class="back" id="mback">← ${esc(repo.name)}</button>`;
  let h;
  if (sessSel) {
    const s = repo.sessions.find(x => x.id === sessSel), mine = touches.filter(t => t.session === sessSel);
    const mods = [...new Set(mine.map(t => t.module))];
    const add = mine.reduce((a, t) => a + t.added, 0), rem = mine.reduce((a, t) => a + t.removed, 0);
    h = back + `<h3><span class="dot" style="background:${v.color[sessSel]}"></span> ${esc(s.tool)} session</h3>
      <div class="meta">${esc(s.model || "")} · ${money(s.usd)} · last edit ${ago(s.last_edit, v.now)} · <span class="plus">+${add}</span> <span class="minus">−${rem}</span></div>
      <p class="role">“${esc(short(s.first_prompt, 280))}”</p>
      <div class="kicker">Changed ${plural(mods.length, "part")}</div>` +
      mods.map(m => `<div class="touch"><b>${esc(m)}</b>${roles[m] ? `<div class="cite">${esc(roles[m].role)}</div>` : ""}` +
        [...new Set(mine.filter(t => t.module === m).map(t => t.file))].slice(0, 8).map(f => `<span class="file">${esc(f)}</span>`).join("") + `</div>`).join("");
  } else if (modSel) {
    const m = repo.modules.find(x => x.id === modSel), r = roles[modSel], mine = touches.filter(t => t.module === modSel);
    const out = repo.edges.filter(e => e.from === modSel).map(e => e.to), inn = repo.edges.filter(e => e.to === modSel).map(e => e.from);
    const ids = [...new Set(mine.map(t => t.session))];
    h = back + `<h3>${esc(m.id)}</h3><div class="meta">${plural(m.files, "file")} · ${m.lines.toLocaleString("en-US")} lines${m.gone ? " · no longer in the repo" : ""}</div>` +
      (r ? `<p class="role">${esc(r.role)}</p><div class="cite">from ${r.cites.map(c => esc(c.split("/").pop())).join(", ")}${repo.architect.stale ? " · update queued" : ""}</div>`
         : `<p class="meta">No description yet. One is written when a model key is set.</p>`) +
      (out.length || inn.length ? `<div class="kicker">Connections</div>` : "") +
      (out.length ? `<div class="meta">uses ${esc(out.join(", "))}</div>` : "") + (inn.length ? `<div class="meta">used by ${esc(inn.join(", "))}</div>` : "") +
      `<div class="kicker">Agent sessions, last ${esc(win)}</div>` +
      (ids.length ? ids.map(id => {
        const list = mine.filter(t => t.session === id);
        const add = list.reduce((a, t) => a + t.added, 0), rem = list.reduce((a, t) => a + t.removed, 0);
        const files = [...new Set(list.map(t => t.file))];
        return sessionRow(repo.sessions.find(x => x.id === id), v, `+${add} −${rem}`) +
          `<div style="padding:0 0 6px 19px">${files.slice(0, 5).map(f => `<span class="file">${esc(f.slice(m.id === "(root)" ? 0 : m.id.length + 1))}</span>`).join("")}${files.length > 5 ? `<span class="cite">and ${files.length - 5} more</span>` : ""}</div>`;
      }).join("") : `<div class="meta">None.</div>`);
  } else {
    const ranked = Object.entries(v.byMod).sort((a, b) => b[1].lines - a[1].lines).slice(0, 6);
    const top = ranked.length ? ranked[0][1].lines : 1;
    h = `<h3>${esc(repo.name)}</h3><div class="meta">${repo.file_count.toLocaleString("en-US")} files</div>` +
      (repo.architect && repo.architect.summary ? `<p class="role">${esc(repo.architect.summary)}</p>` : "") +
      `<div class="kicker">Agent sessions, last ${esc(win)}</div>` +
      (v.sessions.length ? v.sessions.map(s => sessionRow(s, v)).join("") : `<div class="meta">None in this window.</div>`) +
      (ranked.length ? `<div class="kicker">Most changed</div>` + ranked.map(([id, a]) =>
        `<div class="bar2"><span>${esc(id)}</span><span class="meta">${a.lines} lines</span><span class="track"><i style="width:${(100 * a.lines / top).toFixed(0)}%"></i></span></div>`).join("") : "");
  }
  $("#mdetail").innerHTML = h;
  if ($("#mback")) $("#mback").onclick = () => { modSel = sessSel = null; drawMap(); };
  document.querySelectorAll("#mdetail [data-sess]").forEach(b => b.onclick = () => { sessSel = b.dataset.sess; modSel = null; drawMap(); });
}

/* ---------- flow view ---------- */
async function loadTraces() {
  const list = await (await fetch("/api/traces")).json();
  if (!list.length) { $("#tab-flow").innerHTML = `<div class="empty"><b>No refresh has run yet.</b>Press Refresh. Each refresh is traced here: which steps were plain code, which were model calls, and what each cost.</div>`; return; }
  if (!traceSel || !list.find(t => t.id === traceSel)) traceSel = (list.find(t => t.agents > 0) || list[0]).id;
  traceData = await (await fetch("/api/trace?id=" + encodeURIComponent(traceSel))).json();
  const opts = list.map(t => `<option value="${esc(t.id)}"${t.id === traceSel ? " selected" : ""}>${esc(t.id)} · ${t.agents} agent call(s) · ${money(t.usd)}</option>`).join("");
  $("#tab-flow").innerHTML = `<p class="intro"><b>How Lucidity reached what's on the Sessions tab.</b> One graph per refresh. Most steps are plain code; the model is called only for sessions that changed.</p><div class="row"><label for="tsel">Refresh</label><select id="tsel">${opts}</select>
    <span class="note">${traceData.tokens} tokens · ${money(traceData.usd)} · ${traceData.seconds}s. Grey boxes are plain code, outlined boxes are model calls. Click one.</span></div>
    <div class="flowwrap"><div class="svgbox" id="svg"></div><div class="detail" id="detail"></div></div>`;
  $("#tsel").onchange = e => { traceSel = e.target.value; nodeSel = null; loadTraces(); };
  drawFlow();
}

function drawFlow() {
  const t = traceData, depth = {}, kids = {};
  t.edges.forEach(([a, b]) => (kids[a] = kids[a] || []).push(b));
  const roots = t.nodes.filter(n => !t.edges.some(e => e[1] === n.id));
  const q = roots.map(n => [n.id, 0]);
  while (q.length) { const [id, d] = q.shift(); if (depth[id] != null) continue; depth[id] = d; (kids[id] || []).forEach(k => q.push([k, d + 1])); }
  const cols = {}; t.nodes.forEach(n => (cols[depth[n.id] ?? 0] = cols[depth[n.id] ?? 0] || []).push(n));
  const W = 170, H = 54, GX = 46, GY = 18, pos = {};
  const ncol = Object.keys(cols).length, maxRows = Math.max(...Object.values(cols).map(c => c.length));
  const width = ncol * W + (ncol - 1) * GX + 20, height = Math.max(1, maxRows) * (H + GY) + 10;
  Object.entries(cols).forEach(([d, ns]) => {
    const off = (height - ns.length * (H + GY)) / 2;
    ns.forEach((n, i) => pos[n.id] = {x: 10 + d * (W + GX), y: off + i * (H + GY) + GY / 2});
  });
  let s = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="How this refresh decided">`;
  s += `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor" style="color:var(--muted)"/></marker></defs>`;
  t.edges.forEach(([a, b]) => { const p = pos[a], q2 = pos[b]; if (!p || !q2) return;
    const x1 = p.x + W, y1 = p.y + H / 2, x2 = q2.x, y2 = q2.y + H / 2, mx = (x1 + x2) / 2;
    s += `<path class="edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 2},${y2}" marker-end="url(#ar)"/>`; });
  t.nodes.forEach(n => { const p = pos[n.id];
    const sub = n.kind === "agent" ? `${n.tools.length} tool call(s) · ${money(n.usd)}` : "code · $0";
    s += `<g class="node ${n.kind}${n.id === nodeSel ? " sel" : ""}" data-n="${esc(n.id)}" tabindex="0">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8"/>
      <text x="${p.x + 10}" y="${p.y + 22}">${esc(n.label.length > 24 ? n.label.slice(0, 23) + "…" : n.label)}</text>
      <text class="s" x="${p.x + 10}" y="${p.y + 40}">${esc(sub)}</text></g>`; });
  $("#svg").innerHTML = s + `</svg>`;
  document.querySelectorAll(".node").forEach(g => { g.onclick = () => { nodeSel = g.dataset.n; drawFlow(); };
    g.onkeydown = e => { if (e.key === "Enter") { nodeSel = g.dataset.n; drawFlow(); } }; });
  const n = t.nodes.find(x => x.id === nodeSel) || t.nodes.find(x => x.kind === "agent") || t.nodes[0];
  $("#detail").innerHTML = `<h3>${esc(n.label)}</h3><div class="note">${esc(n.kind === "agent" ? "model call" : "plain code, no model")} · ${n.tokens} tokens · ${money(n.usd)}</div>
    ${n.note ? `<p>${esc(n.note)}</p>` : ""}${n.output && n.kind === "code" ? `<p>${esc(n.output)}</p>` : ""}
    ${n.tools.length ? `<b>Tool calls</b>` + n.tools.map(x => `<details><summary>${esc(x.name)} ${esc(x.args)}</summary><pre>${esc(x.result)}</pre></details>`).join("") : ""}
    ${n.input && n.kind === "agent" ? `<details><summary>what it read</summary><pre>${esc(n.input)}</pre></details>` : ""}
    ${n.output && n.kind === "agent" ? `<details open><summary>what it returned</summary><pre>${esc(n.output)}</pre></details>` : ""}`;
}

/* ---------- planner replay ---------- */
let replay = null, rstep = 0, rtimer = null;
async function loadReplay() {
  if (!replay) replay = await (await fetch("/api/replay")).json();
  if (!replay || !replay.events) { $("#tab-replay").innerHTML = `<div class="empty">No recorded replay. Run <code>python scripts/record_replay.py</code>.</div>`; return; }
  rstep = replay.events.length; drawReplay();
}
function drawReplay() {
  const r = replay, plan = r.events.find(e => e.kind === "plan").plan, shown = r.events.slice(0, rstep);
  const st = {}; plan.nodes.forEach(n => st[n.id] = "queued");
  let spent = 0;
  for (const e of shown) {
    if (e.usd && e.kind !== "node_done") spent += e.usd;
    if (e.kind === "node_start") st[e.node] = "running";
    if (e.kind === "node_done") st[e.node] = "done";
    if (["node_stopped", "node_needs_owner", "node_skipped"].includes(e.kind)) st[e.node] = e.kind.replace("node_", "");
  }
  const weak = new Set(shown.filter(e => e.kind === "weak_contract").map(e => e.node));
  const color = {queued: "var(--muted)", running: "var(--work)", done: "var(--done)", stopped: "var(--bad)", needs_owner: "var(--needs)", skipped: "var(--muted)"};
  let h = `<p class="intro"><b>The planner: a goal in, tasks with contracts out.</b> Each task gets done-when conditions a program can check, a budget and a cap on retries. A worker does it and the checker grades it.</p><div class="banner">Replay of a real run recorded ${esc(r.recorded_at)} with ${esc(r.model)} as planner and worker. Nothing is running now; sample mode never spawns agents.</div>
    <div class="row"><b>Goal:</b> ${esc(r.goal)} <span class="pill">${money(spent)} of ${money(r.budget_usd)} budget</span>
    <button id="rplay">${rtimer ? "Pause" : "▶ Play"}</button><button id="rreset">Reset</button>
    <span class="note">step ${rstep} / ${r.events.length}</span></div>
    <p class="note">${esc(plan.summary)}</p><div class="grid">`;
  for (const n of plan.nodes) {
    h += `<div class="card" style="border-left:4px solid ${color[st[n.id]]}"><div class="top"><span class="proj">${esc(n.id)} · ${esc(n.title)}</span>
      <span class="state" style="color:${color[st[n.id]]}">${esc(st[n.id].replace("_", " "))}</span></div>
      <div class="sub">budget ${money(n.budget_usd)} · up to ${n.max_rounds} rounds${n.deps.length ? " · after " + esc(n.deps.join(", ")) : ""}</div>
      <div class="task">${esc(n.prompt)}</div><b style="font-size:12px">Done when</b>` +
      n.done_when.map(c => `<div class="cond">• ${esc(c.kind)}: <code>${esc(c.command || c.path || "")}</code> ${esc(c.kind === "rubric" ? c.text : c.kind === "file_contains" ? "contains “" + c.text + "”" : "")}</div>`).join("") +
      (weak.has(n.id) ? `<div class="box warn"><b>Weak contract</b>This condition already passed before the worker started, so passing it proves nothing. A real test for the toggle would.</div>` : "") + `</div>`;
  }
  h += `</div><h3 style="font-size:14px;margin:16px 0 6px">Timeline</h3><div class="ev" style="max-height:none">` + shown.map(e => {
    let t = e.kind;
    if (e.kind === "goal") t = `goal set, budget ${money(e.budget_usd)}`;
    else if (e.kind === "plan") t = `planner wrote ${e.plan.nodes.length} tasks (${money(e.usd)})` + (e.plan.problems.length ? "; validator: " + e.plan.problems.join("; ") : "");
    else if (e.kind === "node_start") t = `${e.node} started`;
    else if (e.kind === "worker_round") t = `${e.node} worker round ${e.round}: ` + e.tools.map(x => x.tool + (x.arg ? " " + x.arg : "")).join(", ") + ` (${money(e.usd)})`;
    else if (e.kind === "check") t = `${e.node} check: ${e.passed ? "pass" : "FAIL"} · ` + e.results.map(c => `${c.kind} ${c.met === null ? "unchecked" : c.met ? "✓" : "✗"}`).join(", ");
    else if (e.kind === "weak_contract") t = `${e.node} weak contract: ${e.reason}`;
    else if (e.kind === "final_tests") t = `full test suite exit ${e.exit_code}`;
    else t = `${e.kind.replace("_", " ")} ${e.node || ""} ${e.reason || ""}`;
    return `<div><b>${e.t.toFixed(1)}s</b> ${esc(t)}</div>`;
  }).join("") + `</div>`;
  if (rstep >= r.events.length && Object.keys(r.changed_files || {}).length)
    h += Object.entries(r.changed_files).map(([f, c]) => `<details><summary>${esc(f)} after the run</summary><pre class="ev">${esc(c)}</pre></details>`).join("");
  $("#tab-replay").innerHTML = h;
  $("#rplay").onclick = () => {
    if (rtimer) { clearInterval(rtimer); rtimer = null; drawReplay(); return; }
    if (rstep >= replay.events.length) rstep = 0;
    rtimer = setInterval(() => { rstep++; if (rstep >= replay.events.length) { clearInterval(rtimer); rtimer = null; } drawReplay(); }, 700);
    drawReplay();
  };
  $("#rreset").onclick = () => { if (rtimer) clearInterval(rtimer); rtimer = null; rstep = 0; drawReplay(); };
}

/* ---------- evals ---------- */
async function loadEvals() {
  const r = await (await fetch("/api/evals")).json();
  if (!r || !r.configs) { $("#tab-evals").innerHTML = `<div class="empty">No eval results yet. Run <code>python evals/run_evals.py</code>.</div>`; return; }
  const cols = r.columns || Object.keys(r.configs[0].metrics);
  let h = `<p class="intro"><b>How often Lucidity gets it right, and what that costs.</b> Labeled cases run through the real pipeline under different settings. ${esc(r.summary || "")}</p><table class="stack"><thead><tr><th>Configuration</th>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
  for (const c of r.configs) h += `<tr><td data-h="Configuration" style="min-width:200px"><b>${esc(c.name)}</b><div class="note">${esc(c.desc || "")}</div></td>` +
    cols.map(k => `<td class="num" data-h="${esc(k)}">${esc(typeof c.metrics[k] === "number" ? c.metrics[k].toLocaleString("en-US") : c.metrics[k] ?? "")}</td>`).join("") + `</tr>`;
  h += `</tbody></table>`;
  if (r.cases) h += `<details><summary>${r.cases.length} test cases</summary><table class="stack"><thead><tr><th>Case</th><th>Expected</th><th>Got (default, each run)</th></tr></thead><tbody>` +
    r.cases.map(c => `<tr><td data-h="Case">${esc(c.name)}</td><td data-h="Expected">${esc(c.expected)}</td><td data-h="Got">${esc(c.got)}${c.pass ? " ✓" : " ✗"}</td></tr>`).join("") + `</tbody></table></details>`;
  $("#tab-evals").innerHTML = h;
}
poll();
const start = location.hash.slice(1);
loadMap();
setInterval(() => { if (tab === "map") loadMap(); }, 30000);
if (["sessions", "flow", "replay", "evals"].includes(start)) document.querySelector(`nav button[data-tab="${start}"]`).click();
</script>
</body>
