<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucidity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='10' cy='11' r='3.2' fill='white'/%3E%3Ccircle cx='22' cy='11' r='3.2' fill='white' opacity='.7'/%3E%3Ccircle cx='16' cy='22' r='3.2' fill='white'/%3E%3Cpath d='M10 11L16 22M22 11L16 22' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="topbar">
    <a class="brand" href="#runs" aria-label="Lucidity home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="brand-bg"/><circle cx="10" cy="11" r="3.2" fill="#fff"/><circle cx="22" cy="11" r="3.2" fill="#fff" opacity=".7"/><circle cx="16" cy="22" r="3.2" fill="#fff"/><path d="M10 11L16 22M22 11L16 22" stroke="#fff" stroke-width="1.8"/></svg>
      <span>Lucidity</span>
    </a>
    <nav class="nav" aria-label="Views">
      <a href="#runs" data-nav="runs">Runs</a>
      <span class="nav-sep" aria-hidden="true"></span>
      <a href="#sessions" data-nav="sessions" title="Sessions you started by hand, read from their logs">Sessions</a>
      <a href="#map" data-nav="map" title="Which modules hand-started sessions changed">Session map</a>
      <a href="#trace" data-nav="trace" title="How each monitor refresh reached its answer">Trace</a>
      <a href="#evals" data-nav="evals" title="How often the monitor gets it right, and what it costs">Evals</a>
    </nav>
    <span class="grow"></span>
    <div class="meter" id="meter" title="What Lucidity's own planner and checker calls cost today, against the daily cap"></div>
    <button class="icon-btn" id="theme" title="Theme" aria-label="Switch theme"></button>
  </div>
</header>
<div id="offline" class="offline" hidden>Can't reach the Lucidity server. Is <code>python app.py</code> still running?</div>
<main id="main">
  <section id="view-runs" class="view"></section>
  <section id="view-run" class="view" hidden></section>
  <section id="view-sessions" class="view" hidden></section>
  <section id="view-map" class="view" hidden></section>
  <section id="view-trace" class="view" hidden></section>
  <section id="view-evals" class="view" hidden></section>
</main>
<script>
/* Shared helpers, the theme switch and the header meter (/api/snapshot). Views live in app.js and monitor.js. */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const money = n => n == null ? "–" : (n > 0 && n < 0.01 ? "$" + n.toFixed(4) : "$" + n.toFixed(2));
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
const dur = s => { s = Math.max(0, Math.round(s || 0)); return s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s" : (s / 3600).toFixed(1) + "h"; };
const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
let snap = null;

(function theme() {
  const modes = ["auto", "light", "dark"], icon = {auto: "◐", light: "☀", dark: "☾"};
  let m = store.get("lucidity-theme") || "auto";
  const apply = () => {
    if (m === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", m);
    $("#theme").textContent = icon[m]; $("#theme").title = "Theme: " + m;
  };
  $("#theme").onclick = () => { m = modes[(modes.indexOf(m) + 1) % 3]; store.set("lucidity-theme", m); apply(); window.dispatchEvent(new Event("themechange")); };
  apply();
})();

async function pollSnapshot() {
  try {
    snap = await (await fetch("/api/snapshot")).json();
    $("#offline").hidden = true;
    const sc = snap.self_cost || {}, cap = (snap.caps || {}).daily_usd || 1;
    const pct = Math.min(100, 100 * (sc.usd_today || 0) / cap);
    $("#meter").innerHTML = `<span class="meter-label">Model spend today</span> <b>${money(sc.usd_today || 0)}</b><span class="meter-of"> / ${money(cap)}</span><span class="meter-track"><i style="width:${pct}%" class="${pct > 80 ? "hot" : ""}"></i></span>`;
    window.dispatchEvent(new Event("snapshot"));
  } catch (e) { $("#offline").hidden = false; }
  setTimeout(pollSnapshot, snap && snap.refreshing ? 1500 : 10000);
}
pollSnapshot();
</script>
<script src="/static/app.js"></script>
<script src="/static/monitor.js"></script>
</body>
</html>
